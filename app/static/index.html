<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mynews</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    small { color: #777; }
    .meta { display: flex; flex-wrap: wrap; gap: .5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border: 1px solid #999; vertical-align: top; overflow-wrap: anywhere; }
    th { color: #777; font-weight: 600; }
    td { background: #f4f7fb; }
    td:first-child { white-space: nowrap; }
    a { color: #0b57d0; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>mynews: AI TL;DR</h1>
    <div class="meta"><small id="count"></small><small id="version"></small></div>
  </header>
  <main id="news">Loading...</main>
  <script>
    async function load() {
      const box = document.getElementById("news");
      try {
        const res = await fetch("/api/news");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const items = await res.json();
        box.innerHTML = "";
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (const label of ["Date", "Topics", "Link"]) {
          const th = document.createElement("th");
          th.textContent = label;
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);
        const tbody = document.createElement("tbody");
        for (const it of items) {
          const tr = document.createElement("tr");
          const tdDate = document.createElement("td");
          tdDate.textContent = it.published ? new Date(it.published).toDateString() : "-";
          const tdTopics = document.createElement("td");
          tdTopics.textContent = it.topics.join(", ");
          const tdLink = document.createElement("td");
          const a = document.createElement("a");
          a.href = it.link; a.target = "_blank"; a.rel = "noopener";
          a.textContent = it.title || "Open";
          tdLink.appendChild(a);
          tr.append(tdDate, tdTopics, tdLink);
          tbody.appendChild(tr);
        }
        table.append(thead, tbody);
        box.appendChild(table);
        document.getElementById("count").textContent = items.length + (items.length === 1 ? " item" : " items");
      } catch (e) {
        box.textContent = "Could not load news: " + e.message;
      }
      try {
        const v = await (await fetch("/version")).json();
        document.getElementById("version").textContent = "v" + v.version;
      } catch (e) {}
    }
    load();
  </script>
</body>
</html>
