<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mynews</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    small { color: #777; }
    .meta { display: flex; flex-wrap: wrap; gap: .5rem; }
    article { border-bottom: 1px solid #eee; padding: 1rem 0; }
    article h2 { font-size: 1rem; margin: 0 0 .25rem; }
    article a { color: #0b57d0; text-decoration: none; }
    .date { color: #777; font-size: .85rem; }
    .topics { margin: .5rem 0 0; padding-left: 1.2rem; }
  </style>
</head>
<body>
  <header>
    <h1>mynews: AI TL;DR</h1>
    <div class="meta"><small id="count"></small><small id="version"></small></div>
  </header>
  <main id="news">Loading...</main>
  <script>
    async function load() {
      const box = document.getElementById("news");
      try {
        const res = await fetch("/api/news");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const items = await res.json();
        box.innerHTML = "";
        for (const it of items) {
          const el = document.createElement("article");
          const h = document.createElement("h2");
          const a = document.createElement("a");
          a.href = it.link; a.target = "_blank"; a.rel = "noopener";
          a.textContent = it.published ? new Date(it.published).toDateString() : "Issue";
          h.appendChild(a);
          const ul = document.createElement("ul");
          ul.className = "topics";
          for (const t of it.topics) {
            const li = document.createElement("li");
            li.textContent = t;
            ul.appendChild(li);
          }
          el.append(h, ul);
          box.appendChild(el);
        }
        document.getElementById("count").textContent = items.length + (items.length === 1 ? " item" : " items");
      } catch (e) {
        box.textContent = "Could not load news: " + e.message;
      }
      try {
        const v = await (await fetch("/version")).json();
        document.getElementById("version").textContent = "v" + v.version;
      } catch (e) {}
    }
    load();
  </script>
</body>
</html>
