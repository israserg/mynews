<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>mynews</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .5rem; padding: 0 0 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #d0d7de; }
    h1 { color: #ff00ff; margin: 0; font-size: 1.6rem; }
    small { color: #6b7280; }
    .meta { display: flex; flex-wrap: wrap; gap: .5rem; }
    main#news { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 4px 16px rgba(0, 0, 0, .06); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .6rem .75rem; border: 1px solid #d0d7de; vertical-align: top; overflow-wrap: anywhere; }
    th { color: #57606a; font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; background: #f6f8fa; }
    td { background: #fff; }
    tbody tr:nth-child(odd) td { background: #f6f6f6; }
    tbody tr:nth-child(even) td { background: #ececec; }
    tbody tr:hover td { background: #e2e8f0; }
    td:first-child { white-space: nowrap; }
    .chip { display: inline-block; margin: .1rem .3rem .1rem 0; padding: .1rem .6rem; font-size: .8rem; line-height: 1.5; border: 1px solid #c9d3df; border-radius: 999px; background: #fff; color: #374151; }
    a { color: #0b57d0; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .day { display: inline-block; padding: .15rem .6rem; border-radius: 999px; background: #0b57d0; color: #fff; font-weight: 600; font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>AI TL/DR What’s new</h1>
    <div class="meta"><small id="count"></small><small id="version"></small></div>
  </header>
  <main id="news">Loading...</main>
  <script>
    async function load() {
      const box = document.getElementById("news");
      try {
        const res = await fetch("/api/news");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const items = await res.json();
        box.innerHTML = "";
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (const label of ["Date", "Topics", "Link", "Together With"]) {
          const th = document.createElement("th");
          th.textContent = label;
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);
        const tbody = document.createElement("tbody");
        for (const it of items) {
          const tr = document.createElement("tr");
          const tdDate = document.createElement("td");
          tdDate.textContent = it.weekday || "-";
          tdDate.className = "day";
          tdDate.title = it.published ? new Date(it.published).toDateString() : "";
          const tdTopics = document.createElement("td");
          for (const topic of it.topics) {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = topic;
            tdTopics.appendChild(chip);
          }
          const tdLink = document.createElement("td");
          const a = document.createElement("a");
          a.href = it.link; a.target = "_blank"; a.rel = "noopener";
          a.textContent = it.title || "Open";
          tdLink.appendChild(a);
          const tdTogether = document.createElement("td");
          const tw = it.together_with;
          if (tw && tw.link) {
            const twa = document.createElement("a");
            twa.href = tw.link; twa.target = "_blank"; twa.rel = "noopener";
            if (tw.logo) {
              const img = document.createElement("img");
              img.src = tw.logo; img.alt = ""; img.height = 24; img.loading = "lazy";
              twa.appendChild(img);
            } else {
              twa.textContent = "link";
            }
            tdTogether.appendChild(twa);
          } else {
            tdTogether.textContent = "-";
          }
          tr.append(tdDate, tdTopics, tdLink, tdTogether);
          tbody.appendChild(tr);
        }
        table.append(thead, tbody);
        box.appendChild(table);
        document.getElementById("count").textContent = items.length + (items.length === 1 ? " item" : " items");
      } catch (e) {
        box.textContent = "Could not load news: " + e.message;
      }
      try {
        const v = await (await fetch("/version")).json();
        document.getElementById("version").textContent = "v" + v.version;
      } catch (e) {}
    }
    load();
  </script>
</body>
</html>
